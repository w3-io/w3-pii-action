name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@w3-io'

      # @w3-io/action-core is a public org package; the built-in GITHUB_TOKEN
      # reads it. Matches w3-sxt-action — no W3_NPM_TOKEN/PAT needed.
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # @w3-io/action-lint is a PRIVATE org package; cross-repo install via the
      # built-in token depends on the package granting this repo Actions access
      # (org-wide WIP: audie/fix-action-lint-install). Until that lands the same
      # 36 rules are enforced locally via scripts/audit.sh, so don't block CI on
      # the hosted pull.
      - name: Standards lint
        continue-on-error: true
        run: npx @w3-io/action-lint@latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify dist is up to date
        run: |
          # Stage first so `git diff` also catches NEW/untracked ncc chunks,
          # not just modified ones (plain `git diff dist/` ignores untracked).
          git add -A dist/
          git diff --cached --exit-code dist/ || {
            echo "dist/ is out of date (modified or untracked outputs). Run 'npm run build' and commit all of dist/."
            exit 1
          }
